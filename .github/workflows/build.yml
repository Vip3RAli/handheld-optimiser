name: Build and test

on:
  push:
    branches: [main]
  pull_request:

# Building and testing only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The solution includes tools\UpdateSigner, so the release signing tool is built here too.
      - name: Restore
        run: dotnet restore HandheldOptimiser.sln

      - name: Build
        run: dotnet build HandheldOptimiser.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/HandheldOptimiser.Tests/HandheldOptimiser.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      # Inno Setup comes with the runner image; installed here only if an image ever leaves it out.
      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # The update signing key is never on the runner, so the script builds the installer and skips
      # signing it, with a warning. The home app package is signed with a certificate it makes on the spot.
      - name: Build the installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/HandheldOptimiser-Setup-*.exe
          if-no-files-found: error
