name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HandheldOptimiser.sln

      - name: Build
        run: dotnet build HandheldOptimiser.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/HandheldOptimiser.Tests/HandheldOptimiser.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      # The Game Bar widget is an old-style UWP project, which needs Visual Studio's MSBuild rather than
      # dotnet. Release, so .NET Native compiles it as it will for the installer.
      - uses: microsoft/setup-msbuild@v2

      - name: Build the Game Bar widget
        run: msbuild src\HandheldOptimiser.GameBar\HandheldOptimiser.GameBar.csproj /restore /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo

      # Unsigned; build-installer.ps1 signs it. Unzipped into artifacts\GameBar, it lets an installer be
      # built on a machine without Visual Studio's UWP tools.
      - uses: actions/upload-artifact@v4
        with:
          name: GameBar-widget
          path: artifacts/GameBar/
