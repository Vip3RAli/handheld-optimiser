name: Build and test

on:
  push:
    branches: [main]
  pull_request:

# Building and testing only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The solution includes tools\UpdateSigner, so the release signing tool is built here too.
      - name: Restore
        run: dotnet restore HandheldOptimiser.sln

      - name: Build
        run: dotnet build HandheldOptimiser.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/HandheldOptimiser.Tests/HandheldOptimiser.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      # The Game Bar widget is an old-style UWP project, which needs Visual Studio's MSBuild rather than
      # dotnet. Release, so .NET Native compiles it as it will for the installer.
      - uses: microsoft/setup-msbuild@v2

      - name: Build the Game Bar widget
        run: msbuild src\HandheldOptimiser.GameBar\HandheldOptimiser.GameBar.csproj /restore /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo

      # Unsigned; build-installer.ps1 signs it. Unzipped into artifacts\GameBar, it lets an installer be
      # built on a machine without Visual Studio's UWP tools. Uploaded before the installer is built,
      # since that build may build the widget again in the same folder.
      - uses: actions/upload-artifact@v4
        with:
          name: GameBar-widget
          path: artifacts/GameBar/

      # Inno Setup comes with the runner image; installed here only if an image ever leaves it out.
      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # The update signing key is never on the runner, so the script builds the installer and skips
      # signing it, with a warning. The home app package is signed with a certificate it makes on the spot.
      - name: Build the installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/HandheldOptimiser-Setup-*.exe
          if-no-files-found: error
